name: HOYTAS v130 Windows test
on:
  push:
    branches: [test-v130-cari-tasarimi]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 7
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pillow pypdf
      - name: Customer card, double-click and filtered exports
        shell: pwsh
        run: |
          $env:HOYTAS_PROFILE_DIR = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          python test_v130_card.py
      - name: Existing navigation
        shell: pwsh
        run: |
          $env:HOYTAS_PROFILE_DIR = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          python test_v123_ui.py
