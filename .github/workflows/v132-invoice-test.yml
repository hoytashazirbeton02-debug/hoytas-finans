name: HOYTAS v132 Windows invoice tests
on:
  push:
    branches: [test-v132-fatura-eslestirme]
permissions:
  contents: read
jobs:
  desktop:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pillow pypdf
      - name: Invoice accounting and existing desktop behavior
        shell: pwsh
        run: |
          $env:HOYTAS_PROFILE_DIR = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          python test_v132_invoice.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HOYTAS_PROFILE_DIR = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          python test_v130_card.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:HOYTAS_PROFILE_DIR
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          python -m unittest discover -q
