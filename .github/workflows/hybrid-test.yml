name: Hybrid prototype tests
on:
  push:
    branches: [hibrit-altyapi-test]
permissions:
  contents: read
jobs:
  offline:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m compileall hybrid_test
      - run: python -m unittest discover -s hybrid_test -v
