name: HOYTAS Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version, e.g. v79'
        required: true
        type: string
  push:
    tags:
      - 'v[0-9]*'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${INPUT_VERSION:-$REF_NAME}"
          if ! [[ "$VERSION" =~ ^v[0-9]+$ ]]; then
            echo "Invalid version: $VERSION"; exit 1
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Validate and package
        env:
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          test -f hoytas.py || { echo 'Source hoytas.py missing'; exit 1; }
          python -m py_compile hoytas.py
          mkdir -p dist
          zip -r "dist/HOYTAS_${VERSION}.zip" . -x '.git/*' '.github/*' 'dist/*' '*.db' '*.sqlite' '*.sqlite3' '__pycache__/*'
          cd dist
          sha256sum "HOYTAS_${VERSION}.zip" > SHA256SUMS.txt
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.value }}
        run: |
          gh release create "$VERSION" "dist/HOYTAS_${VERSION}.zip" dist/SHA256SUMS.txt --title "HOYTAS $VERSION" --generate-notes --latest --verify-tag
