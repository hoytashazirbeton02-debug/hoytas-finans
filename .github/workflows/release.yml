name: HOYTAS Release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/release.yml'
      - 'hoytas.py'
      - 'DEGISIKLIKLER_v*.txt'
      - 'Baslat.vbs'
      - 'Baslat.bat'
      - 'kurulum.bat'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v80)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tkinter for Linux validation
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk
      - name: Build and validate HOYTAS release package
        id: package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${VERSION:-}"
          VERSION="$(printf '%s' "$VERSION" | tr -d '[:space:]')"
          if [[ -z "$VERSION" ]]; then VERSION="v$(sed -n 's/^APP_VERSION = //p' hoytas.py | head -1)"; fi
          if [[ "$VERSION" =~ ^[0-9]+$ ]]; then VERSION="v${VERSION}"; fi
          [[ "$VERSION" =~ ^v[0-9]+$ ]] || { echo "Invalid version: $VERSION"; exit 1; }
          echo "Publishing $VERSION"
          test -f "DEGISIKLIKLER_${VERSION}.txt"
          test -f hoytas.py
          test -f Baslat.vbs
          python -m py_compile hoytas.py
          python test_v82_integrity.py
          python test_v83_source.py
          export VERSION
          python - <<'PY'
          import ast, pathlib, re, os
          source = pathlib.Path("hoytas.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          assert re.search(r"^APP_VERSION = " + re.escape(os.environ["VERSION"].lstrip("v")) + r"$", source, re.M)
          assert re.search(r"^TARGET_SCHEMA_VERSION = 50$", source, re.M)
          for required in ("fatura_tahsilat", "tevkifat_tutar", "tahsil_edilecek", "def tahsilat_fatura", "def add_fatura"):
              assert required in source, required
          assert len([n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == "add_fatura"]) == 1
          assert 'def tahsilat_fatura(self):' in source
          guard = ast.get_source_segment(source, next(n for n in ast.walk(tree) if isinstance(n, ast.FunctionDef) and n.name == "tahsilat_fatura"))
          assert 'INSERT INTO fatura_tahsilat' not in guard, "Unreconciled receipts must be disabled"
          assert '"fatura_tahsilat", "gelen_fatura"' in source, "Receipt audit trail missing"
          print("v83 source and migration checks passed")
          PY
          mkdir -p dist
          VERSION="$VERSION" python - <<'PY'
          import os, pathlib, subprocess, zipfile
          version = os.environ["VERSION"]
          names = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          excluded = (".github/", "packages/", "dist/")
          files = []
          for name in names:
              if not name or name.startswith(excluded) or "/__pycache__/" in name:
                  continue
              if name.lower().endswith((".db", ".sqlite", ".sqlite3", ".zip", ".pyc")):
                  continue
              path = pathlib.Path(name)
              if path.is_file():
                  files.append(name)
          required = {"hoytas.py", "Baslat.vbs", f"DEGISIKLIKLER_{version}.txt"}
          assert required.issubset(files), f"Missing required files: {required - set(files)}"
          output = pathlib.Path("dist") / f"HOYTAS_{version}.zip"
          with zipfile.ZipFile(output, "w", zipfile.ZIP_DEFLATED) as z:
              for name in files:
                  z.write(name)
          with zipfile.ZipFile(output) as z:
              assert z.testzip() is None
              assert required.issubset(z.namelist())
          print(f"Validated {output} ({len(files)} files)")
          PY
          cd dist
          sha256sum "HOYTAS_${VERSION}.zip" > SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists: $VERSION"
            exit 0
          fi
          gh release create "$VERSION" "dist/HOYTAS_${VERSION}.zip" dist/SHA256SUMS.txt --title "HOYTAS $VERSION" --generate-notes --latest --target "${GITHUB_SHA}"
