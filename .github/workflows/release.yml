name: HOYTAS Release
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. v79)'
        required: true
        type: string
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate version and existing package
        id: package
        shell: bash
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          [[ "$VERSION" =~ ^v[0-9]+$ ]] || { echo "Invalid version"; exit 1; }
          ZIP="packages/HOYTAS_${VERSION}_BUTUN_MENU_DUGME_DUZELTME.zip"
          if [[ "$VERSION" == "v79" ]]; then
            ZIP="packages/HOYTAS_v79_BUTUN_MENU_DUGME_DUZELTME.zip"
          fi
          test -f "$ZIP" || { echo "Missing release ZIP: $ZIP"; exit 1; }
          unzip -t "$ZIP" >/dev/null
          python -m py_compile hoytas.py
          mkdir -p dist
          cp "$ZIP" "dist/HOYTAS_${VERSION}.zip"
          cd dist
          sha256sum "HOYTAS_${VERSION}.zip" > SHA256SUMS.txt
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$VERSION" >/dev/null 2>&1; then
            echo "Release already exists: $VERSION"
            exit 1
          fi
          gh release create "$VERSION" "dist/HOYTAS_${VERSION}.zip" dist/SHA256SUMS.txt --title "HOYTAS $VERSION" --generate-notes --latest --target "${GITHUB_SHA}"
