name: HOYTAS v134 Invoice Tests
on:
  push:
    branches: [test-v134-fatura]
permissions:
  contents: read
  statuses: write
jobs:
  windows-tests:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pillow pypdf
      - name: Test desktop navigation and reports
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $env:HOYTAS_PROFILE_DIR = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          python test_v123_ui.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HOYTAS_PROFILE_DIR = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          python test_v129_concrete.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HOYTAS_PROFILE_DIR = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          python test_v130_card.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HOYTAS_PROFILE_DIR = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          python test_v132_invoice.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HOYTAS_PROFILE_DIR = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          python test_v133_invoice_period.py --desktop
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $env:HOYTAS_PROFILE_DIR = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          python test_v134_invoice.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Remove-Item Env:HOYTAS_PROFILE_DIR
          $env:LOCALAPPDATA = Join-Path $env:RUNNER_TEMP ([guid]::NewGuid().ToString())
          python -m unittest discover -q
      - name: Record test result on the commit
        if: always()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          TEST_RESULT: ${{ job.status }}
        run: |
          $state = if ($env:TEST_RESULT -eq "success") { "success" } else { "failure" }
          gh api --method POST "repos/$env:GITHUB_REPOSITORY/statuses/$env:GITHUB_SHA" -f "state=$state" -f "context=HOYTAS v134 Windows" -f "target_url=$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID"
